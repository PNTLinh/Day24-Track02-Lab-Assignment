repos:
  # Secret detection with custom patterns for Vietnamese medical data
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        # run without requiring baseline file to avoid baseline-read errors in Windows pre-commit hook
        # use `detect-secrets scan --baseline .secrets.baseline` manually when needed
        # Patterns for Vietnamese PII and credentials
        additional_dependencies: []

  # Linting and formatting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict

  # Python security scanning (disabled on Windows due to encoding/packaging issues)
